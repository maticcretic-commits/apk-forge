<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#6c3df4">
<title>Hello Forge</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh;
    color: #fff;
    background: linear-gradient(160deg, #1a1033 0%, #2b1a5e 50%, #101a3a 100%);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 32px 24px; text-align: center;
    -webkit-tap-highlight-color: transparent;
  }
  .orb {
    width: 96px; height: 96px; border-radius: 28px;
    background: linear-gradient(135deg, #a06bff, #5b2ee5);
    display: flex; align-items: center; justify-content: center;
    font-size: 48px; margin-bottom: 28px;
    box-shadow: 0 18px 50px rgba(108, 61, 244, .55);
    animation: float 3.2s ease-in-out infinite;
  }
  @keyframes float { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-12px) } }
  h1 { font-size: clamp(28px, 7vw, 40px); font-weight: 800; letter-spacing: -0.5px; margin-bottom: 12px; }
  h1 span { background: linear-gradient(90deg, #c9a7ff, #7dd3fc); -webkit-background-clip: text; background-clip: text; color: transparent; }
  p { opacity: .75; font-size: 16px; line-height: 1.6; max-width: 340px; margin-bottom: 32px; }
  button {
    border: 0; cursor: pointer; font-size: 17px; font-weight: 700; color: #fff;
    padding: 16px 40px; border-radius: 999px;
    background: linear-gradient(90deg, #7c4dff, #4f9cf9);
    box-shadow: 0 10px 30px rgba(124, 77, 255, .45);
    transition: transform .15s ease, box-shadow .15s ease;
  }
  button:active { transform: scale(.96); box-shadow: 0 4px 14px rgba(124, 77, 255, .4); }
  #count { margin-top: 22px; font-size: 15px; opacity: .8; min-height: 22px; }
  #count b { color: #c9a7ff; font-size: 20px; }
  footer { position: fixed; bottom: calc(16px + env(safe-area-inset-bottom)); font-size: 12px; opacity: .45; }
</style>
</head>
<body>
  <div class="orb">⚒️</div>
  <h1>Hello from <span>APK Forge</span></h1>
  <p>This starter app was packaged into a real Android APK by APK Forge Studio. Edit this file and make it yours.</p>
  <button id="tapBtn">Tap me</button>
  <div id="count"></div>
  <footer>Built with APK Forge Studio</footer>
<script>
  let taps = 0;
  const btn = document.getElementById('tapBtn');
  const count = document.getElementById('count');
  btn.addEventListener('click', () => {
    taps++;
    count.innerHTML = `You tapped <b>${taps}</b> time${taps === 1 ? '' : 's'} 🎉`;
    btn.style.transform = 'scale(.94)';
    setTimeout(() => btn.style.transform = '', 120);
  });
</script>
</body>
</html>
